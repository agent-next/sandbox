<!doctype html>
<html
  data-composition-variables='[
    {"id": "glb", "type": "string", "label": "Model path (project-relative)",
     "default": "media/model.glb"},
    {"id": "duration", "type": "number", "label": "Shot length (s)",
     "default": 7, "min": 1, "max": 20},
    {"id": "caption", "type": "string", "label": "Kinetic caption",
     "default": ""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <!-- The importmap must be in the assembled page for a bare "three"
         specifier to resolve; it is re-injected here as well because the
         host's document is what actually parses scripts. -->
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <template>
      <link rel="stylesheet" href="shared.css" />

      <div
        id="root"
        data-root="true"
        data-composition-id="hf-model3d"
        data-width="1920"
        data-height="1080"
      >
        <canvas
          id="hf-model3d-canvas"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
          "
        ></canvas>

        <!-- A soft floor glow under the model, so the turntable reads as a
             studio set rather than an object floating in the void. -->
        <div
          data-layout-ignore
          style="
            position: absolute;
            inset: 0;
            pointer-events: none;
            background:
              radial-gradient(60% 34% at 50% 86%, rgba(46, 196, 182, 0.16) 0%, rgba(0, 0, 0, 0) 70%),
              radial-gradient(120% 120% at 50% 42%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.6) 100%);
          "
        ></div>

        <!-- Small animated tag, driven by the GSAP timeline below. -->
        <div id="hf-model3d-tag" class="chip" style="right: 96px">live glb</div>

        <!-- Kinetic caption, when this shot carries one. -->
        <p id="hf-model3d-caption" class="caption"></p>
      </div>

      <script>
        const V = window.__hyperframes.getVariables();
        const CAPTION = V.caption || "";

        // The turntable motion comes from the Three.js adapter's seek event,
        // but this composition still registers one paused timeline: it is the
        // duration source (the Three.js adapter cannot infer one), and it
        // carries the tag's entrance.
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          "#hf-model3d-tag",
          { opacity: 0, y: -14 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
          0.2
        );
        tl.to(
          "#hf-model3d-tag",
          { opacity: 1, duration: 0.2 },
          Math.max(0.4, Number(V.duration) - 0.6)
        );

        // Kinetic caption, fully in by 0.5 s.
        if (CAPTION) {
          document.getElementById("hf-model3d-caption").textContent = CAPTION;
          tl.fromTo(
            "#hf-model3d-caption",
            { opacity: 0, y: 30 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.05
          );
        } else {
          document.getElementById("hf-model3d-caption").style.display = "none";
        }

        window.__timelines["hf-model3d"] = tl;

        // A module script runs at ROOT scope, so window.__hyperframes.getVariables()
        // inside one resolves the host's variables, not this instance's. This
        // classic script does see the per-instance values, so it publishes the
        // model path for the module script below (which is deferred, and
        // therefore runs after this). One 3D shot per video is the template's
        // contract, so a single slot is enough.
        window.__hfModelShot = { glb: V.glb, duration: Number(V.duration) };
      </script>

      <script type="module">
        import * as THREE from "three";
        import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

        const GLB = window.__hfModelShot.glb;

        const canvas = document.getElementById("hf-model3d-canvas");
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        // Pin the drawing buffer to the composition's frame: device-pixel-ratio
        // dependent output would make the render non-reproducible.
        renderer.setPixelRatio(1);
        renderer.setSize(1920, 1080, false);
        renderer.setClearColor(0x061218, 1);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(34, 1920 / 1080, 0.1, 100);

        // Studio lighting: a key, a hemisphere fill standing in for the
        // environment bounce, and two rim lights in the palette's pass/fail
        // hues so the silhouette separates from the background.
        scene.add(new THREE.HemisphereLight(0xd6ecff, 0x0b2028, 1.5));
        const key = new THREE.DirectionalLight(0xffffff, 3.4);
        key.position.set(2.6, 3.4, 3.0);
        scene.add(key);
        const teal = new THREE.DirectionalLight(0x2ec4b6, 2.2);
        teal.position.set(-3.2, 0.6, -2.4);
        scene.add(teal);
        const warm = new THREE.DirectionalLight(0xff8a3d, 1.3);
        warm.position.set(1.6, -1.4, -3.0);
        scene.add(warm);

        const pivot = new THREE.Group();
        scene.add(pivot);

        let radius = 1;

        function renderAt(time) {
          // The whole visual state is a function of `time`: an orbiting camera
          // and a turntable spin. No clock, no rAF, no frame deltas.
          pivot.rotation.y = time * 0.62;
          const orbit = 0.7 + Math.sin(time * 0.42) * 0.5;
          const lift = 0.9 + Math.sin(time * 0.55) * 0.34;
          const dist = radius * 3.35;
          camera.position.set(
            Math.sin(orbit) * dist,
            lift * radius,
            Math.cos(orbit) * dist
          );
          camera.lookAt(0, 0, 0);
          renderer.render(scene, camera);
        }

        const buildReady = new Promise((resolve) => {
          new GLTFLoader().load(
            GLB,
            (gltf) => {
              const model = gltf.scene;
              // Frame the model from its own bounding sphere, so the same
              // composition works for any glb.
              const box = new THREE.Box3().setFromObject(model);
              const sphere = box.getBoundingSphere(new THREE.Sphere());
              radius = Math.max(0.4, sphere.radius);
              model.position.sub(sphere.center);
              pivot.add(model);
              renderAt(0);
              resolve(true);
            },
            undefined,
            (err) => {
              console.error("model3d: glb failed to load", GLB, err);
              resolve(false);
            }
          );
        });

        // Declared-compute hold: the runtime waits for this before it calls the
        // composition ready, so the first captured frame is a real render.
        window.__hf = window.__hf || {};
        window.__hf.buildReady = window.__hf.buildReady || {};
        window.__hf.buildReady["hf-model3d"] = buildReady;

        // The adapter publishes HyperFrames time on every seek and asks for
        // exactly that frame.
        window.addEventListener("hf-seek", (event) => renderAt(event.detail.time));
        renderAt(window.__hfThreeTime || 0);
      </script>
    </template>
  </body>
</html>
