[printer]
kinematics: cartesian
max_velocity: 500
max_accel: 12000
max_z_velocity: 30
max_z_accel: 1500

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_min: 0
position_max: 250
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_min: 0
position_max: 210
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0
position_min: 0
position_max: 256
homing_speed: 10

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: AD595
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -50
max_temp: 280
min_extrude_temp: -50
max_extrude_only_distance: 200.0
max_extrude_cross_section: 5.0
max_extrude_only_velocity: 30
max_extrude_only_accel: 2500

[heater_bed]
heater_pin: PH5
sensor_type: PT100 INA826
sensor_pin: PK6
control: watermark
min_temp: -50
max_temp: 130

[mcu]
serial: /tmp/klippy-test/mcu.serial
baud: 250000
