# OrcaSlicer setting overrides for the 3dprint-gcode demo.
# The judge merges these over its base process preset (judge/orca-base.json,
# which inherits 0.20mm Standard @BBL A1) and re-slices task/bracket.stl;
# the G-code below must match that re-slice exactly.
layer_height = 0.20
first_layer_height = 0.20
line_width = 0.42
initial_layer_line_width = 0.42
wall_loops = 2
top_shell_layers = 4
bottom_shell_layers = 3
sparse_infill_density = 15
sparse_infill_pattern = grid
filament_diameter = 1.75
external_perimeter_speed = 25
initial_layer_speed = 20
skirt_loops = 1
skirt_distance = 2.2
min_skirt_length = 4
brim_type = no_brim
brim_width = 0
enable_support = 0
gellet_dependent_settings = 0
