<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four-stroke engine — anatomy figure</title>
<style>
  :root {
    --paper: #f6f3ec; --card: #fffdf7; --ink: #2a2520; --faint: #8d8577;
    --line: #d8d2c4; --accent: #b3402a; --steel: #2b6a9e; --bronze: #a0622d;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink);
         font: 15px/1.45 "Iowan Old Style", Georgia, serif; padding: 24px; }
  .card { background: var(--card); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px 20px; max-width: 1180px;
          margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: baseline;
           border-bottom: 1px solid var(--line); padding-bottom: 10px; }
  h1 { font-size: 21px; font-weight: 600; letter-spacing: .2px; }
  .fig-no { color: var(--faint); font: 13px/1 ui-monospace, monospace; }
  .stage { display: flex; gap: 18px; margin-top: 14px; }
  canvas { background: #fbf9f2; border: 1px solid var(--line); border-radius: 6px;
           touch-action: none; cursor: grab; display: block; }
  canvas:active { cursor: grabbing; }
  .hint { color: var(--faint); font-size: 12.5px; margin-top: 6px; }
  aside { width: 300px; flex: none; display: flex; flex-direction: column; }
  .parts { list-style: none; padding: 0; margin: 0 0 12px; overflow-y: auto;
           max-height: 388px; border: 1px solid var(--line); border-radius: 6px;
           background: #fdfbf5; }
  .parts li { padding: 5px 12px; border-bottom: 1px solid var(--line);
              cursor: pointer; user-select: none; font-size: 14px; }
  .parts li:last-child { border-bottom: none; }
  .parts li:hover { background: #f1ecdf; }
  .parts li.selected { background: #f3ddd6; color: var(--accent); font-weight: 600; }
  [data-part-info] { border: 1px solid var(--line); border-radius: 6px;
                     background: #fdfbf5; padding: 12px 14px; min-height: 108px; }
  [data-part-info] h2 { font-size: 15px; margin-bottom: 6px; color: var(--accent); }
  [data-part-info] p { font-size: 13.5px; color: #4c463d; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink);
             color: #f6f3ec; font: 12px/1.3 ui-monospace, monospace;
             padding: 3px 7px; border-radius: 4px; display: none; z-index: 5; }
  .readout { margin-top: 10px; color: var(--faint);
             font: 12px/1.4 ui-monospace, monospace; }
</style>
</head>
<body>
<div class="card">
  <header>
    <h1 data-machine="four-stroke-engine">Four-stroke engine</h1>
    <div class="fig-no">Fig 1 · single cylinder · Otto cycle · wireframe</div>
  </header>
  <div class="stage">
    <div>
      <canvas id="fig" width="760" height="520" aria-label="Isometric wireframe of a four-stroke engine"></canvas>
      <div class="hint">Drag to orbit · ←/→ turn the camera · click a part in the list to inspect it</div>
      <div class="readout" id="readout">azimuth 35° · elevation 22° · 17 parts</div>
    </div>
    <aside>
      <ul class="parts" id="parts"></ul>
      <div data-part-info><h2>Nothing selected</h2>
        <p>Click a part to see what it does in the cycle.</p></div>
    </aside>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Anatomy-style isometric wireframe figure of a single-cylinder four-stroke
// engine. Raw WebGL 1, no dependencies: the parts are plain line primitives
// in engine coordinates (mm, Y up, crankshaft axis along Z), the camera is
// an orthographic orbit the user drags.
// ---------------------------------------------------------------------------

const PARTS = [
  { id: "piston", name: "Piston", family: "bronze", desc: "Slides in the cylinder; combustion pressure pushes it down the bore on the power stroke." },
  { id: "piston-rings", name: "Piston rings", family: "bronze", desc: "Seal the gap between piston and cylinder wall so the pressure stays above the piston." },
  { id: "piston-pin", name: "Piston pin", family: "bronze", desc: "Hinge between the piston and the connecting rod, letting the rod swing as the crank turns." },
  { id: "connecting-rod", name: "Connecting rod", family: "bronze", desc: "Converts the piston's straight stroke into rotation at the crank pin." },
  { id: "crankshaft", name: "Crankshaft", family: "bronze", desc: "Turns the rod's push into shaft torque; its crank pin rides at a 55 mm radius." },
  { id: "flywheel", name: "Flywheel", family: "bronze", desc: "Heavy disc that stores energy from the power stroke and keeps the crank turning between fires." },
  { id: "crankcase", name: "Crankcase", family: "graphite", desc: "Encloses and supports the crankshaft, and carries the main bearings and the oil." },
  { id: "cylinder", name: "Cylinder", family: "graphite", desc: "Precision bore that guides the piston through all four strokes of the cycle." },
  { id: "cylinder-head", name: "Cylinder head", family: "graphite", desc: "Caps the top of the cylinder; it carries the valves, the ports and the spark plug." },
  { id: "combustion-chamber", name: "Combustion chamber", family: "accent", desc: "Volume between piston crown and head where the compressed charge is burned." },
  { id: "intake-valve", name: "Intake valve", family: "steel", desc: "Opens on the intake stroke to let the fresh air-fuel mixture into the cylinder." },
  { id: "exhaust-valve", name: "Exhaust valve", family: "steel", desc: "Opens on the exhaust stroke to release the burnt gases from the cylinder." },
  { id: "valve-spring", name: "Valve spring", family: "steel", desc: "Closes its valve the moment the cam lobe passes, keeping the valve on its cam." },
  { id: "camshaft", name: "Camshaft", family: "steel", desc: "Rotates at half crank speed and times each valve opening with its lobes." },
  { id: "spark-plug", name: "Spark plug", family: "steel", desc: "Ignites the compressed charge with a spark near the end of the compression stroke." },
  { id: "intake-manifold", name: "Intake manifold", family: "green", desc: "Duct that feeds the air-fuel mixture from the throttle to the intake port." },
  { id: "exhaust-manifold", name: "Exhaust manifold", family: "green", desc: "Duct that collects the burnt gases from the exhaust port and leads them away." },
];

const FAMILY_COLOR = {
  graphite: [0.29, 0.27, 0.30], bronze: [0.63, 0.38, 0.18],
  steel: [0.17, 0.42, 0.62], green: [0.20, 0.50, 0.36],
  accent: [0.70, 0.25, 0.16],
};
const HOVER_TINT = 0.72;      // darken factor when hovered
const SELECT_COLOR = [0.62, 0.10, 0.08];

// -- geometry helpers (all return flat arrays of segment endpoints) --------
function circle(r, y, cx, cz, seg) {
  const pts = [];
  for (let i = 0; i < seg; i++) {
    const a0 = (i / seg) * 2 * Math.PI, a1 = ((i + 1) / seg) * 2 * Math.PI;
    pts.push(cx + r * Math.cos(a0), y, cz + r * Math.sin(a0),
             cx + r * Math.cos(a1), y, cz + r * Math.sin(a1));
  }
  return pts;
}
function tube(r, y0, y1, cx, cz, seg) {          // open cylinder wall
  const pts = circle(r, y0, cx, cz, seg).concat(circle(r, y1, cx, cz, seg));
  for (let i = 0; i < 4; i++) {                  // four generators
    const a = (i / 4) * 2 * Math.PI;
    pts.push(cx + r * Math.cos(a), y0, cz + r * Math.sin(a),
             cx + r * Math.cos(a), y1, cz + r * Math.sin(a));
  }
  return pts;
}
function zTube(r, z0, z1, cx, cy, seg) {         // cylinder along the Z axis
  const pts = [];
  for (const z of [z0, z1]) {
    for (let i = 0; i < seg; i++) {
      const a0 = (i / seg) * 2 * Math.PI, a1 = ((i + 1) / seg) * 2 * Math.PI;
      pts.push(cx + r * Math.cos(a0), cy + r * Math.sin(a0), z,
               cx + r * Math.cos(a1), cy + r * Math.sin(a1), z);
    }
  }
  const a = 0;
  pts.push(cx + r, cy, z0, cx + r, cy, z1);
  pts.push(cx - r, cy, z0, cx - r, cy, z1);
  pts.push(cx, cy + r, z0, cx, cy + r, z1);
  pts.push(cx, cy - r, z0, cx, cy - r, z1);
  return pts;
}
function box(x0, x1, y0, y1, z0, z1) {
  const c = [[x0, y0, z0], [x1, y0, z0], [x1, y0, z1], [x0, y0, z1],
             [x0, y1, z0], [x1, y1, z0], [x1, y1, z1], [x0, y1, z1]];
  const e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  const pts = [];
  for (const [a, b] of e) pts.push(...c[a], ...c[b]);
  return pts;
}
function polyline(p) {               // p: flat [x,y,z, x,y,z, ...]
  const pts = [];
  for (let i = 0; i + 5 < p.length; i += 3) pts.push(p[i], p[i+1], p[i+2], p[i+3], p[i+4], p[i+5]);
  return pts;
}
function coil(r, y0, y1, cx, cz, turns, seg) {   // spring: zigzag collar
  const pts = [];
  const n = Math.round(turns * seg);
  for (let i = 0; i < n; i++) {
    const t0 = i / n, t1 = (i + 1) / n;
    pts.push(cx + r * Math.cos(t0 * turns * 2 * Math.PI), y0 + t0 * (y1 - y0), cz + r * Math.sin(t0 * turns * 2 * Math.PI),
             cx + r * Math.cos(t1 * turns * 2 * Math.PI), y0 + t1 * (y1 - y0), cz + r * Math.sin(t1 * turns * 2 * Math.PI));
  }
  return pts;
}

// -- the engine, crank frozen at 35 deg so the rod is visibly slanted ------
const CRANK_A = 35 * Math.PI / 180, CRANK_R = 55;
const pin = [CRANK_R * Math.cos(CRANK_A), CRANK_R * Math.sin(CRANK_A), 0]; // crank pin (x,y)
const pistonY = 122 + Math.sqrt(150 * 150 - (pin[0]) * (pin[0]));  // rod length 150
const GEOM = {
  "crankcase":        box(-95, 95, -70, 12, -95, 95),
  "cylinder":         tube(42, 40, 160, 0, 0, 24),
  "piston":           tube(38, pistonY - 18, pistonY + 14, 0, 0, 20),
  "piston-rings":     circle(39, pistonY + 9, 0, 0, 24).concat(circle(39, pistonY + 5.5, 0, 0, 24))
                        .concat(circle(39, pistonY + 2, 0, 0, 24)),
  "piston-pin":       zTube(8, -26, 26, 0, pistonY - 2, 14),
  "connecting-rod":   (function () {
                        const bigR = 22, smallR = 10;
                        return polyline([pin[0] - bigR * Math.sin(CRANK_A), pin[1] + bigR * Math.cos(CRANK_A), 0,
                                         -smallR * Math.sin(CRANK_A), pistonY - 2 + smallR * Math.cos(CRANK_A), 0])
                          .concat(polyline([pin[0] + bigR * Math.sin(CRANK_A), pin[1] - bigR * Math.cos(CRANK_A), 0,
                                            smallR * Math.sin(CRANK_A), pistonY - 2 - smallR * Math.cos(CRANK_A), 0]))
                          .concat(circle(bigR, 0, pin[0], 0, 18))
                          .concat(circle(smallR, 0, 0, pistonY - 2, 14));
                      })(),
  "crankshaft":       zTube(14, -78, -58, 0, 0, 14).concat(zTube(14, 58, 78, 0, 0, 14))
                        .concat(zTube(11, -14, 14, pin[0], pin[1], 12))       // crank pin
                        .concat(polyline([0, 0, -58, pin[0] * 0.55, pin[1] * 0.55, -30]))
                        .concat(polyline([0, 0, 58, pin[0] * 0.55, pin[1] * 0.55, 30])),
  "flywheel":         circle(105, 80, 0, 0, 40).concat(circle(105, 62, 0, 0, 40))
                        .concat(circle(16, 80, 0, 0, 12))
                        .concat((function () {  // six spokes between the two rim faces
                          const pts = [];
                          for (let i = 0; i < 6; i++) {
                            const a = (i / 6) * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
                            pts.push(20 * c, 20 * s, 80, 100 * c, 100 * s, 80);
                          }
                          return pts;
                        })()),
  "cylinder-head":    box(-55, 55, 160, 190, -55, 55),
  "combustion-chamber": tube(38, 148, 160, 0, 0, 24),
  "intake-valve":     tube(4, 163, 205, -17, 0, 8).concat(circle(19, 163, -17, 0, 16))
                        .concat(circle(8, 161.5, -17, 0, 10)),
  "exhaust-valve":    tube(4, 163, 205, 17, 0, 8).concat(circle(19, 163, 17, 0, 16))
                        .concat(circle(8, 161.5, 17, 0, 10)),
  "valve-spring":     coil(12, 172, 200, -17, 0, 4, 10).concat(coil(12, 172, 200, 17, 0, 4, 10)),
  "camshaft":         zTube(9, -46, 46, 0, 225, 12)
                        .concat((function () {  // two lobes: eccentric circles
                          const pts = [];
                          for (const z of [-24, 24]) {
                            for (let i = 0; i < 16; i++) {
                              const a0 = (i / 16) * 2 * Math.PI, a1 = ((i + 1) / 16) * 2 * Math.PI;
                              const r0 = 13 + 6 * Math.cos(a0), r1 = 13 + 6 * Math.cos(a1);
                              pts.push(r0 * Math.cos(a0), 225 + r0 * Math.sin(a0), z,
                                       r1 * Math.cos(a1), 225 + r1 * Math.sin(a1), z);
                            }
                          }
                          return pts;
                        })()),
  "spark-plug":       tube(6, 190, 206, 0, 0, 8).concat(circle(11, 206, 0, 0, 6))
                        .concat(tube(2.5, 160, 190, 0, 0, 6)),
  "intake-manifold":  (function () {  // three rings marching left, then the runner
                        const pts = [];
                        const path = [[-55, 175, 0], [-75, 172, 0], [-95, 164, 0], [-110, 148, 0], [-110, 110, 0]];
                        for (const [x, y, z] of path.slice(1)) pts.push(...circle(13, y, x, z, 12));
                        pts.push(...polyline([-55, 175 + 13, 0, -110, 148 + 13, 0]));
                        pts.push(...polyline([-55, 175 - 13, 0, -110, 148 - 13, 0]));
                        pts.push(...polyline([-110, 148 + 13, 0, -110, 110 + 13, 0]));
                        pts.push(...polyline([-110, 148 - 13, 0, -110, 110 - 13, 0]));
                        pts.push(...circle(13, 110, -110, 0, 12));
                        return pts;
                      })(),
  "exhaust-manifold": (function () {
                        const pts = [];
                        const path = [[55, 175, 0], [75, 172, 0], [95, 164, 0], [110, 148, 0], [110, 104, 0]];
                        for (const [x, y, z] of path.slice(1)) pts.push(...circle(12, y, x, z, 12));
                        pts.push(...polyline([55, 175 + 12, 0, 110, 148 + 12, 0]));
                        pts.push(...polyline([55, 175 - 12, 0, 110, 148 - 12, 0]));
                        pts.push(...polyline([110, 148 + 12, 0, 110, 104 + 12, 0]));
                        pts.push(...polyline([110, 148 - 12, 0, 110, 104 - 12, 0]));
                        pts.push(...circle(12, 104, 110, 0, 12));
                        return pts;
                      })(),
};

// -- minimal mat4 ------------------------------------------------------------
function orthoM(l, r, b, t, n, f) {
  return [2/(r-l),0,0,0, 0,2/(t-b),0,0, 0,0,-2/(f-n),0,
          -(r+l)/(r-l), -(t+b)/(t-b), -(f+n)/(f-n), 1];
}
function lookAtM(eye, c, up) {
  const z = norm(sub(eye, c)), x = norm(cross(up, z)), y = cross(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
          -dot(x,eye), -dot(y,eye), -dot(z,eye), 1];
}
function mulM(a, b) {              // a*b, column-major
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++)
    for (let k = 0; k < 4; k++) o[c*4+r] += a[k*4+r] * b[c*4+k];
  return o;
}
const sub = (a,b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]];
const cross = (a,b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const dot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const norm = (a) => { const l = Math.hypot(...a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; };

// -- WebGL setup --------------------------------------------------------------
const canvas = document.getElementById("fig");
const gl = canvas.getContext("webgl", { antialias: true });
if (!gl) throw new Error("WebGL context could not be created");

const VS = `
attribute vec3 aPos;
uniform mat4 uMVP;
void main() { gl_Position = uMVP * vec4(aPos, 1.0); }`;
const FS = `
precision mediump float;
uniform vec3 uColor;
void main() { gl_FragColor = vec4(uColor, 1.0); }`;
function shader(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);
const uMVP = gl.getUniformLocation(prog, "uMVP");
const uColor = gl.getUniformLocation(prog, "uColor");
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);

const buffers = {}, counts = {};
for (const p of PARTS) {
  const data = new Float32Array(GEOM[p.id]);
  buffers[p.id] = gl.createBuffer();
  counts[p.id] = data.length / 3;
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers[p.id]);
  gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
}

gl.clearColor(0.984, 0.976, 0.949, 1);   // #fbf9f2, same as the CSS canvas bg
gl.enable(gl.DEPTH_TEST);

// -- camera -------------------------------------------------------------------
const CENTER = [0, 82, 0], ELEV = 22 * Math.PI / 180, DIST = 700;
let yawDeg = 35;
let selected = null, hovered = null;
const readout = document.getElementById("readout");

function draw() {
  const w = canvas.width, h = canvas.height;
  gl.viewport(0, 0, w, h);
  const yaw = yawDeg * Math.PI / 180;
  const eye = [CENTER[0] + DIST * Math.cos(ELEV) * Math.sin(yaw),
               CENTER[1] + DIST * Math.sin(ELEV),
               CENTER[2] + DIST * Math.cos(ELEV) * Math.cos(yaw)];
  const halfH = 205, halfW = halfH * (w / h);
  const mvp = mulM(orthoM(-halfW, halfW, -halfH, halfH, 10, 1400),
                   lookAtM(eye, CENTER, [0, 1, 0]));
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.uniformMatrix4fv(uMVP, false, new Float32Array(mvp));
  for (const p of PARTS) {
    let c = FAMILY_COLOR[p.family];
    if (p.id === selected) c = SELECT_COLOR;
    else if (p.id === hovered) c = c.map((v) => v * (1 - HOVER_TINT) + 0.05);
    gl.uniform3f(uColor, c[0], c[1], c[2]);
    gl.bindBuffer(gl.ARRAY_BUFFER, buffers[p.id]);
    gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);
    /* mutant: draw call removed */;
  }
  readout.textContent =
    `azimuth ${((yawDeg % 360) + 360) % 360 | 0}° · elevation 22° · 17 parts` +
    (selected ? ` · selected: ${PARTS.find((p) => p.id === selected).name}` : "");
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// -- rotation: pointer drag + arrow keys --------------------------------------
let dragging = false, lastX = 0;
canvas.addEventListener("pointerdown", (e) => {
  dragging = true; lastX = e.clientX;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener("pointermove", (e) => {
  if (dragging) {
    yawDeg += (e.clientX - lastX) * 0.4;      // 2.5 px per degree
    lastX = e.clientX;
  } else {
    hitTest(e);
  }
});
canvas.addEventListener("pointerup", (e) => { dragging = false;
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {} });
canvas.addEventListener("pointerleave", () => { hovered = null; hideTooltip(); });
window.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") yawDeg -= 15;
  else if (e.key === "ArrowRight") yawDeg += 15;
  else return;
  e.preventDefault();
});

// -- parts list + info panel ---------------------------------------------------
const list = document.getElementById("parts");
const info = document.querySelector("[data-part-info]");
const tooltip = document.getElementById("tooltip");
for (const p of PARTS) {
  const li = document.createElement("li");
  li.dataset.part = p.id;
  li.textContent = p.name;
  li.addEventListener("click", () => select(p));
  list.appendChild(li);
}
function select(p) {
  selected = p.id;
  for (const li of list.children) li.classList.toggle("selected", li.dataset.part === p.id);
  info.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = p.name;
  const d = document.createElement("p"); d.textContent = p.desc;
  info.appendChild(h); info.appendChild(d);
}

// -- canvas hover: screen-space bbox of each part's vertices -------------------
function partScreenBox(p) {
  const w = canvas.width, h = canvas.height;
  const yaw = yawDeg * Math.PI / 180;
  const eye = [CENTER[0] + DIST * Math.cos(ELEV) * Math.sin(yaw),
               CENTER[1] + DIST * Math.sin(ELEV),
               CENTER[2] + DIST * Math.cos(ELEV) * Math.cos(yaw)];
  const halfH = 205, halfW = halfH * (w / h);
  const mvp = mulM(orthoM(-halfW, halfW, -halfH, halfH, 10, 1400),
                   lookAtM(eye, CENTER, [0, 1, 0]));
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const g = GEOM[p.id];
  for (let i = 0; i < g.length; i += 3) {
    const x = g[i], y = g[i+1], z = g[i+2];
    const cx = mvp[0]*x + mvp[4]*y + mvp[8]*z + mvp[12];
    const cy = mvp[1]*x + mvp[5]*y + mvp[9]*z + mvp[13];
    const cw = mvp[3]*x + mvp[7]*y + mvp[11]*z + mvp[15];
    const sx = (cx / cw * 0.5 + 0.5) * w, sy = (1 - (cy / cw * 0.5 + 0.5)) * h;
    if (sx < x0) x0 = sx; if (sx > x1) x1 = sx;
    if (sy < y0) y0 = sy; if (sy > y1) y1 = sy;
  }
  return { x0, x1, y0, y1 };
}
function hitTest(e) {
  const r = canvas.getBoundingClientRect();
  const px = (e.clientX - r.left) * (canvas.width / r.width);
  const py = (e.clientY - r.top) * (canvas.height / r.height);
  let best = null, bestD = 1e9;
  for (const p of PARTS) {
    const b = partScreenBox(p);
    const cxp = (b.x0 + b.x1) / 2, cyp = (b.y0 + b.y1) / 2;
    const inside = px >= b.x0 && px <= b.x1 && py >= b.y0 && py <= b.y1;
    const d = Math.hypot(px - cxp, py - cyp);
    if (inside && d < bestD) { bestD = d; best = p; }
  }
  hovered = best ? best.id : null;
  if (best) {
    tooltip.style.display = "block";
    tooltip.style.left = (e.clientX + 14) + "px";
    tooltip.style.top = (e.clientY + 10) + "px";
    tooltip.textContent = best.name;
  } else hideTooltip();
}
function hideTooltip() { tooltip.style.display = "none"; }
</script>
</body>
</html>
