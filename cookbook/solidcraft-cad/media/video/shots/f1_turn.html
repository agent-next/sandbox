<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: turntable</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #141a24; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<!--
  Footage only. Every caption, number and badge is added by the master
  composition (index.html) so the story text lives in one place.

  The 3D is the graded deliverable: part.step (written by SolidCraft) converted
  to part.glb by media/video/export_glb.py, loaded face by face and turned by
  a pure function of the frame time.
-->
<div id="stage" data-composition-id="f1-turn" data-start="0" data-duration="10" data-width="1920" data-height="1080"></div>
<script type="module">
import { makeRig, loadFaces, placeCamera } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.25, background: 0x141a24 });
const model = loadFaces(rig, '../assets/part.glb');

window.__timelines = {
  'f1-turn': {
    seek: (t) => {
      if (model.ready) {
        // 2 rad/s turntable plus a camera arc and dolly: measured 1.00
        // moving-frame fraction at 640 px (scripts/measure_motion.py).
        rig.holder.rotation.y = -0.62 + t * 1.95;
        rig.holder.rotation.x = 0.40 + Math.sin(t * 1.1) * 0.10;
        placeCamera(rig.camera, {
          dist: 6.4 - t * 0.22,
          azim: 13 * Math.sin(t * 0.85),
          elev: 4 * Math.sin(t * 0.5),
          fov: 30,
        });
        rig.lights.key.position.set(4 * Math.cos(t * 0.6) + 2, 6, 5 * Math.sin(t * 0.6) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f1-turn'].seek(0);
</script>
</body>
</html>
