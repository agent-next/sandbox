<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: SolidCraft build stages</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #10151d; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<!--
  Footage only — captions come from the master composition. The geometry grows
  through the real SolidCraft builds make_media.py exports as stage11/15/16:
  the good design script truncated after 11, 15 and 16 commands, so the visible
  cuts are the extrude of the plate and the join of the boss.
-->
<div id="stage" data-composition-id="f2-stages" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<script type="module">
import { makeRig, loadFaces, placeCamera, span, easeOut } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.2, background: 0x10151d });
const BUILDS = [
  { n: 11, glb: '../assets/stage11.glb' },
  { n: 15, glb: '../assets/stage15.glb' },
  { n: 16, glb: '../assets/stage16.glb' },
];
const loaded = BUILDS.map((b) => ({ ...b, model: loadFaces(rig, b.glb) }));
const CUT = 5 / BUILDS.length;

window.__timelines = {
  'f2-stages': {
    seek: (t) => {
      const idx = Math.min(BUILDS.length - 1, Math.floor(t / CUT));
      loaded.forEach((b, i) => b.model.faces.forEach((f) => { f.visible = i === idx && b.model.ready; }));
      rig.holder.rotation.y = -0.62 + t * 1.25;
      rig.holder.rotation.x = 0.42 + Math.sin(t * 0.8) * 0.10;
      placeCamera(rig.camera, {
        dist: 6.6 - 0.30 * easeOut(span(t, 0, 5)),
        azim: 11 * Math.sin(t * 0.75),
        elev: 5 * Math.sin(t * 0.5),
        fov: 30,
      });
      rig.lights.key.position.set(4 * Math.cos(t * 0.5) + 2, 6, 5 * Math.sin(t * 0.5) + 3);
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f2-stages'].seek(0);
</script>
</body>
</html>
