<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — SolidCraft builds it</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #10151d; }
  #stage { position: absolute; inset: 0; }
  .hud { position: absolute; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #eef1f6; }
  #head { left: 92px; top: 84px; font-size: 52px; font-weight: 700; letter-spacing: -.01em; }
  #head .c { color: #4ec9a0; }
  #step {
    left: 92px; bottom: 116px; font-size: 38px; line-height: 1.42; font-weight: 600;
    text-shadow: 0 4px 22px rgba(0,0,0,.9);
  }
  #step .n { color: #ffd48a; font-variant-numeric: tabular-nums; }
  #cmd {
    left: 92px; bottom: 62px; font-size: 27px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #8fb4d8; letter-spacing: .01em;
  }
  #rail { right: 92px; top: 150px; width: 12px; height: 620px; background: rgba(255,255,255,.13); border-radius: 8px; }
  #bar { width: 12px; height: 0px; background: #4ec9a0; border-radius: 8px; }
  #cnt { right: 92px; top: 800px; font-size: 30px; color: #9fe8cd; font-variant-numeric: tabular-nums; text-align: right; }
</style>
</head>
<body>
<div id="stage" data-composition-id="shot-build" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<div id="head" class="hud">SolidCraft builds it <span class="c">in 16 commands</span></div>
<div id="step" class="hud"><span class="n">1</span> rounded plate, bore and 4 bolt holes on the PCD</div>
<div id="cmd" class="hud">sketch.rectangle.rounded &#183; sketch.circle.center</div>
<div id="rail" class="hud"><div id="bar"></div></div>
<div id="cnt" class="hud">16 / 16</div>

<script type="module">
import { makeRig, loadFaces, placeCamera, span, easeOut } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.2, background: 0x10151d });

// Four real SolidCraft builds of the same script truncated after 11, 15 and 16
// commands (media/video/export_glb.py on each intermediate STEP). The shot
// swaps which build is on screen, so the geometry grows for real.
const BUILDS = [
  { n: 11, glb: '../assets/stage11.glb', label: '1', cmd: 'sketch.rectangle.rounded · sketch.circle.center',
    text: 'rounded plate R5, Ø22 bore, 4 bolt holes on the PCD' },
  { n: 15, glb: '../assets/stage15.glb', label: '2', cmd: 'solid.extrude  distance = thickness',
    text: 'the sketch extrudes to a solid — thickness drives it' },
  { n: 16, glb: '../assets/stage16.glb', label: '3', cmd: 'solid.extrude  boss_height, join',
    text: 'boss Ø32 × 3 mm on top, joined to the plate' },
];
const loaded = BUILDS.map((b) => ({ ...b, model: loadFaces(rig, b.glb) }));

const stepEl = document.getElementById('step');
const cmdEl = document.getElementById('cmd');
const barEl = document.getElementById('bar');
const cntEl = document.getElementById('cnt');
const CUT = 5 / BUILDS.length; // seconds per build step

window.__timelines = {
  'shot-build': {
    seek: (t) => {
      const idx = Math.min(BUILDS.length - 1, Math.floor(t / CUT));
      loaded.forEach((b, i) => { b.model.faces.forEach((f) => { f.visible = i === idx && b.model.ready; }); });

      // Camera keeps orbiting across every stage boundary: no still frames.
      rig.holder.rotation.y = -0.62 + t * 1.25;
      rig.holder.rotation.x = 0.42 + Math.sin(t * 0.8) * 0.10;
      placeCamera(rig.camera, {
        dist: 6.6 - 0.30 * easeOut(span(t, 0, 5)),
        azim: 11 * Math.sin(t * 0.75),
        elev: 5 * Math.sin(t * 0.5),
        fov: 30,
      });
      rig.lights.key.position.set(4 * Math.cos(t * 0.5) + 2, 6, 5 * Math.sin(t * 0.5) + 3);

      const b = BUILDS[idx];
      const local = span(t, idx * CUT, (idx + 1) * CUT);
      stepEl.innerHTML = `<span class="n">${b.label}</span> ${b.text}`;
      cmdEl.textContent = `step ${b.n} of 16 · ${b.cmd}`;
      barEl.style.height = `${620 * easeOut(span(t, 0, 5))}px`;
      cntEl.textContent = `${b.n} / 16 commands`;

      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['shot-build'].seek(0);
</script>
</body>
</html>
