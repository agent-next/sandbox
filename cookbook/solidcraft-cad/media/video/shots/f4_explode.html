<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: exploded faces</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0b1018; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<!--
  Footage only. Each of the glb's tessellated faces rides out along its own
  centroid direction, which turns the single graded solid into a readable
  exploded view. The part closes again in the last second.
-->
<div id="stage" data-composition-id="f4-explode" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<script type="module">
import { makeRig, loadFaces, placeCamera, span, easeInOut, THREE } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { look: 'dark', fov: 32, exposure: 1.2 });
const model = loadFaces(rig, '../assets/part.glb', { look: 'dark' });

const dirs = [];
function prepare() {
  if (!model.ready || dirs.length) return;
  for (const f of model.faces) {
    const c = f.userData.centroid.clone();
    const radial = new THREE.Vector3(c.x, c.y, 0);
    if (radial.lengthSq() < 1e-9) radial.set(0, 0, 1);
    radial.normalize();
    // Top faces lift, bottom faces drop, so the stack opens along Z too.
    const zBias = Math.abs(c.z) < 0.4 ? 0 : Math.sign(c.z) * 0.55;
    dirs.push(radial.multiplyScalar(0.85).add(new THREE.Vector3(0, 0, zBias)));
  }
}

window.__timelines = {
  'f4-explode': {
    seek: (t) => {
      prepare();
      if (model.ready) {
        const amt = easeInOut(span(t, 0.35, 1.95)) * (1 - easeInOut(span(t, 3.7, 4.8)));
        model.faces.forEach((f, i) => {
          const d = dirs[i] || new THREE.Vector3();
          f.position.set(d.x * amt, d.y * amt, d.z * amt);
        });
        rig.holder.rotation.y = -0.55 + t * 1.05;
        rig.holder.rotation.x = 0.30 + Math.sin(t * 0.7) * 0.16;
        placeCamera(rig.camera, {
          dist: 7.5 - 1.4 * Math.sin(Math.PI * span(t, 0, 5)) - amt * 0.6,
          azim: 10 * Math.sin(t * 0.6),
          elev: 4 * Math.sin(t * 0.45),
          fov: 32,
        });
        rig.lights.key.position.set(4 * Math.cos(t * 0.5) + 2, 6, 5 * Math.sin(t * 0.5) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f4-explode'].seek(0);
</script>
</body>
</html>
