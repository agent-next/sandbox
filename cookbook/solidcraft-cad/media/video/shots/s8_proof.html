<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — the verdict</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0e14;
               font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  .hud { position: absolute; color: #eef1f6; }

  #badge {
    left: 92px; top: 108px; display: flex; align-items: center; gap: 26px;
    background: rgba(10,16,22,.86); border: 3px solid #4ec9a0; border-radius: 20px;
    padding: 26px 40px 26px 34px;
  }
  #badge .tick { width: 74px; height: 74px; }
  #badge .lbl { font-size: 82px; font-weight: 800; letter-spacing: -.02em; color: #4ec9a0; line-height: .95; }
  #badge .sub { font-size: 27px; color: #9fb0c8; margin-top: 6px; letter-spacing: .04em; }

  #rows { left: 92px; top: 296px; width: 1050px; }
  .row {
    display: grid; grid-template-columns: 62px 1fr 300px; align-items: center;
    background: rgba(12,18,26,.82); border-left: 6px solid #4ec9a0; border-radius: 10px;
    margin-bottom: 13px; padding: 15px 26px; opacity: 0; transform: translateX(-60px);
  }
  .row .g { font-size: 25px; color: #4ec9a0; font-weight: 700; }
  .row .n { font-size: 33px; font-weight: 600; }
  .row .v { font-size: 29px; color: #a8b8cf; text-align: right; font-variant-numeric: tabular-nums; }
  .row .v b { color: #fff; }

  #kills {
    left: 1210px; top: 108px; width: 620px; background: rgba(12,18,26,.86);
    border: 1px solid #24303f; border-radius: 18px; padding: 30px 34px;
  }
  #kills .cap { font-size: 25px; color: #8ea0ba; letter-spacing: .16em; text-transform: uppercase; }
  #kills .big { font-size: 118px; font-weight: 800; letter-spacing: -.04em; color: #ffd48a; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #kills .sub { font-size: 27px; color: #a8b8cf; }
  #grid { margin-top: 22px; display: grid; grid-template-columns: repeat(10, 1fr); gap: 9px; }
  #grid i { height: 42px; border-radius: 7px; background: #26313f; }
  #grid i.dead { background: #4ec9a0; }

  #foot { left: 92px; bottom: 74px; font-size: 30px; color: #9fb0c8; }
  #foot b { color: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage" data-composition-id="shot-proof" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>

<div class="hud" id="badge">
  <svg class="tick" viewBox="0 0 24 24" fill="none"><path d="M3 13l6 6L21 5" stroke="#4ec9a0" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div><div class="lbl">PASS</div><div class="sub" id="bcap">8 of 8 gates</div></div>
</div>

<div class="hud" id="rows"></div>

<div class="hud" id="kills">
  <div class="cap">Self-test kill rate</div>
  <div class="big" id="kbig">0 %</div>
  <div class="sub"><b id="kn">0</b> of 19 single-edit mutants killed</div>
  <div id="grid"></div>
</div>

<div class="hud" id="foot">
  volume <b id="fvol">0</b> mm&#179; vs analytic <b id="fana">0</b> &nbsp;&#183;&nbsp;
  mass <b id="fmass">0</b> g &nbsp;&#183;&nbsp; kernels agree <b id="fkern">0</b> &nbsp;&#183;&nbsp;
  STL <b id="fstl">0</b> triangles
</div>

<script type="module">
import { makeRig, loadFaces, placeCamera } from '../lib/part.js';

// The footage keeps playing under the HUD: this is the same real glb, still
// turning, with the verdict laid over it rather than on a card of its own.
const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.05, background: 0x0a0e14 });
rig.renderer.domElement.style.cssText = 'position:absolute;left:560px;top:60px;width:1360px;height:960px;opacity:.95;';
const model = loadFaces(rig, '../assets/part.glb');

const p = await fetch('../assets/proof.json').then((r) => r.json());
const NAMES = {
  build: 'SolidCraft builds the script',
  occt_shape: 'OpenCascade reads the STEP',
  volume: 'volume vs analytic',
  features: 'bore, boss, holes, fillets + walls',
  mass: 'mass under the limit',
  cross_check: 'the two kernels agree',
  parametric: 'thickness +2 mm rebuild',
  stl: 'mesh is watertight',
};
const rowsEl = document.getElementById('rows');
const rows = p.gate_order.map((k) => {
  const d = document.createElement('div');
  d.className = 'row';
  const detail = {
    volume: `<b>${p.volume_rel_dev.toExponential(2)}</b> rel. dev., limit ${(p.volume_limit_rel * 100).toFixed(1)} %`,
    mass: `<b>${p.mass_g.toFixed(2)}</b> g, limit ${p.mass_limit_g} g`,
    features: `<b>${p.wall_checks}</b>/<b>${p.wall_checks}</b> wall checks`,
    cross_check: `<b>${p.kernels_volume_rel_dev.toExponential(2)}</b> vs OCCT`,
    parametric: `<b>${p.param_delta_mm3.toFixed(2)}</b> mm³, analytic ${p.param_analytic_mm3.toFixed(2)}`,
    stl: `<b>${p.stl_triangles}</b> triangles, <b>${(p.stl_rel_dev * 100).toFixed(3)}</b> % from STEP`,
    occt_shape: `bbox within <b>${p.bbox_max_dev_mm}</b> mm`,
    build: `STEP + STL written`,
  }[k] || '';
  d.innerHTML = `<div class="g">✓</div><div class="n">${NAMES[k]}</div><div class="v">${detail}</div>`;
  rowsEl.appendChild(d);
  return d;
});

const grid = document.getElementById('grid');
const cells = [];
for (let i = 0; i < p.mutants_total; i++) { const c = document.createElement('i'); grid.appendChild(c); cells.push(c); }

const kbig = document.getElementById('kbig');
const kn = document.getElementById('kn');
const set = (id, v) => { document.getElementById(id).textContent = v; };
set('bcap', `${p.gate_order.length} of ${p.gate_order.length} gates`);
set('fvol', Math.round(p.volume_mm3).toLocaleString('en-US'));
set('fana', Math.round(p.analytic_mm3).toLocaleString('en-US'));
set('fmass', p.mass_g.toFixed(2));
set('fkern', p.kernels_volume_rel_dev.toExponential(1));
set('fstl', p.stl_triangles.toLocaleString('en-US'));

window.__timelines = {
  'shot-proof': {
    seek: (t) => {
      // Rows slide in one after another over the still-moving footage.
      rows.forEach((d, i) => {
        const a = 0.25 + i * 0.34;
        const s = Math.min(1, Math.max(0, (t - a) / 0.42));
        const e = 1 - Math.pow(1 - s, 3);
        d.style.opacity = String(e);
        d.style.transform = `translateX(${-60 * (1 - e)}px)`;
      });
      const n = Math.round(p.mutants_total * Math.min(1, Math.max(0, (t - 1.9) / 2.4)));
      cells.forEach((c, i) => c.classList.toggle('dead', i < n));
      kn.textContent = String(n);
      kbig.textContent = `${Math.round((n / p.mutants_total) * 100)} %`;

      if (model.ready) {
        rig.holder.rotation.y = -0.62 + t * 0.78;
        rig.holder.rotation.x = 0.34 + Math.sin(t * 0.6) * 0.06;
        placeCamera(rig.camera, { dist: 6.2, azim: 10 + 5 * Math.sin(t * 0.5), elev: 8, fov: 30 });
        rig.lights.key.position.set(4 * Math.cos(t * 0.4) + 2, 6, 5 * Math.sin(t * 0.4) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['shot-proof'].seek(0);
</script>
</body>
</html>
