<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — the ask</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #171d27; }
  #stage { position: absolute; inset: 0; }
  .hud { position: absolute; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #eef1f6; }
  #src { left: 92px; top: 82px; font-size: 26px; letter-spacing: .2em; text-transform: uppercase; color: #8ea0ba; }
  #ask {
    left: 92px; top: 138px; width: 900px; font-size: 46px; line-height: 1.34; font-weight: 500;
    text-shadow: 0 4px 26px rgba(0,0,0,.9);
  }
  #ask .k { color: #4ec9a0; font-weight: 700; }
  #ask b { color: #ffd48a; }
  #spec {
    left: 92px; bottom: 138px; font-size: 31px; line-height: 1.62; color: #c3cfe1;
    background: rgba(10,13,18,.78); border-left: 6px solid #4ec9a0; padding: 24px 32px;
    text-shadow: 0 2px 14px rgba(0,0,0,.85);
  }
  #spec b { color: #fff; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage" data-composition-id="shot-prompt" data-start="0" data-duration="3.2" data-width="1920" data-height="1080"></div>
<div id="src" class="hud">spec.json &mdash; the part to model</div>
<div id="ask" class="hud">
  <span class="k">Ask your agent</span> &rarr; write a SolidCraft command script
  for this adapter plate, parametric in <b>thickness</b>.
</div>
<div id="spec" class="hud">
  60 &times; 50 &times; <b>6</b> mm plate, corner R5 &nbsp;&middot;&nbsp; bore &Oslash;<b>22</b><br />
  boss &Oslash;<b>32</b> &times; 3 mm &nbsp;&middot;&nbsp; <b>4</b> &times; &Oslash;3.4 on PCD <b>43.84</b> mm
</div>

<script type="module">
import { makeRig, loadFaces, placeCamera } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.2, background: 0x171d27 });
// stage11 = the extruded plate alone: one real SolidCraft build step, so the
// ask sits beside the shape it produces rather than beside a drawing.
const model = loadFaces(rig, '../assets/stage11.glb');

window.__timelines = {
  'shot-prompt': {
    seek: (t) => {
      if (model.ready) {
        rig.holder.rotation.y = -0.62 + t * 1.6;
        rig.holder.rotation.x = 0.42 + Math.sin(t * 0.9) * 0.10;
        placeCamera(rig.camera, {
          dist: 6.2 - t * 0.15,
          azim: 12 * Math.sin(t * 0.7),
          elev: 5 * Math.sin(t * 0.45),
          fov: 30,
        });
        rig.lights.key.position.set(4 * Math.cos(t * 0.55) + 2, 6, 5 * Math.sin(t * 0.55) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['shot-prompt'].seek(0);
</script>
</body>
</html>
