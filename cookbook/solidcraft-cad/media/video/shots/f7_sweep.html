<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: parametric thickness sweep</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #e9edf3; }
  #stage { position: absolute; inset: 0; }
  #stage canvas { position: absolute !important; left: 900px !important; top: 120px !important;
                  width: 920px !important; height: 860px !important; }
</style>
</head>
<body>
<!--
  Footage only. The parametric gate: one command parameter, thickness, swept
  across the five values the run measured (media/data/sweep.json), the part
  growing and shrinking as it is rebuilt. The volume rail is drawn by the
  master composition from the same JSON.
-->
<div id="stage" data-composition-id="f7-sweep" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<script type="module">
import { makeRig, loadFaces, placeCamera, span, easeOut } from '../lib/part.js';
import { SWEEP } from '../lib/run.js';

const rig = makeRig(document.getElementById('stage'), { look: 'light', fov: 30, exposure: 1.2 });
const models = SWEEP.map((s) => ({ ...s, model: loadFaces(rig, `../assets/sweep${s.thickness_mm.toFixed(1)}.glb`, { look: 'light' }) }));

const SLICE = 1 / SWEEP.length;

window.__timelines = {
  'f7-sweep': {
    seek: (t) => {
      const idx = Math.min(SWEEP.length - 1, Math.floor(t / SLICE));
      models.forEach((m, i) => m.model.faces.forEach((f) => { f.visible = i === idx && m.model.ready; }));
      rig.holder.rotation.y = -0.62 + t * 1.45;
      rig.holder.rotation.x = 0.42 + Math.sin(t * 0.8) * 0.10;
      placeCamera(rig.camera, {
        dist: 6.6 - 0.28 * easeOut(span(t, 0, 5)),
        azim: 11 * Math.sin(t * 0.7),
        elev: 5 * Math.sin(t * 0.45),
        fov: 30,
      });
      rig.lights.key.position.set(4 * Math.cos(t * 0.55) + 2, 6, 5 * Math.sin(t * 0.55) + 3);
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f7-sweep'].seek(0);
</script>
</body>
</html>
