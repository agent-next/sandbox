<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: section sweep</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0c1119; }
  #stage { position: absolute; inset: 0; }
</style>
</head>
<body>
<!--
  Footage only. A clipping plane sweeps through the graded solid along X, so
  the camera looks straight into the Ø22 bore and the Ø3.4 bolt holes while
  the plane is inside the material — the same "pin through the hole" the
  judge's wall checks measure.
-->
<div id="stage" data-composition-id="f5-section" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>
<script type="module">
import { makeRig, loadFaces, placeCamera, span, easeInOut, THREE } from '../lib/part.js';

const rig = makeRig(document.getElementById('stage'), { fov: 32, exposure: 1.2, background: 0x0c1119 });
const model = loadFaces(rig, '../assets/part.glb');

// Normal (-1,0,0) keeps n.p + c >= 0, i.e. the half-space x <= c, so driving c
// from above the part down through it cuts the material open.
const plane = new THREE.Plane(new THREE.Vector3(-1, 0, 0), 99);
rig.renderer.clippingPlanes = [plane];
rig.renderer.localClippingEnabled = true;

let ready = false;
let bounds = null;
function prepare() {
  if (!model.ready || ready) return;
  ready = true;
  bounds = new THREE.Box3().setFromObject(rig.model);
}

window.__timelines = {
  'f5-section': {
    seek: (t) => {
      prepare();
      const inOut = easeInOut(span(t, 0.4, 1.2)) * (1 - easeInOut(span(t, 3.9, 4.75)));
      if (bounds) {
        const x = bounds.max.x - span(t, 1.2, 3.9) * (bounds.max.x - bounds.min.x);
        plane.constant = (bounds.max.x + 2) * (1 - inOut) + x * inOut;
      }
      if (model.ready) {
        rig.holder.rotation.y = -0.10 + t * 0.9;
        rig.holder.rotation.x = 0.08 + Math.sin(t * 0.6) * 0.05;
        placeCamera(rig.camera, {
          dist: 7.2 - 0.8 * easeInOut(span(t, 0, 5)),
          azim: 26 - t * 3.2,
          elev: 12 - t * 1.5,
          fov: 32,
        });
        rig.lights.key.position.set(4 * Math.cos(t * 0.5) + 2, 6, 5 * Math.sin(t * 0.5) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f5-section'].seek(0);
</script>
</body>
</html>
