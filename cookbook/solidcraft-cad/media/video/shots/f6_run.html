<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>solidcraft-cad — footage: the sandbox run, sped up</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0e14;
               font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
  #stage { position: absolute; inset: 0; }
  #term {
    position: absolute; left: 96px; top: 138px; width: 1010px; height: 806px;
    background: #0d1219; border: 1px solid #22303f; border-radius: 16px; overflow: hidden;
  }
  #termbar { height: 56px; background: #121a25; border-bottom: 1px solid #22303f;
             display: flex; align-items: center; padding: 0 24px; }
  #termbar .dot { width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; }
  #termbar .t { margin-left: 18px; color: #9db0c9; font-size: 23px; font-family: ui-monospace, Menlo, monospace; }
  #log { position: absolute; inset: 56px 0 0 0; padding: 20px 28px; overflow: hidden; }
  #log .ln { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px;
             line-height: 42px; color: #c6d5e8; white-space: pre; }
  #log .ln.ok { color: #57d3a5; }
  #log .ln.kill { color: #ffd08a; }
</style>
</head>
<body>
<!--
  Footage only — captions come from the master composition.

  The left pane replays judge/selftest.sh exactly as this sandbox ran it: each
  line is stamped with the elapsed second at which the selftest printed it, so
  compressing 604 s into this shot's duration is a real speed-up, not a staged
  typing animation. On the right, the graded part keeps turning.
-->
<div id="stage" data-composition-id="f6-run" data-start="0" data-duration="5" data-width="1920" data-height="1080"></div>

<div id="term">
  <div id="termbar">
    <div class="dot" style="background:#f06d63"></div>
    <div class="dot" style="background:#f2be4f"></div>
    <div class="dot" style="background:#5fc46a"></div>
    <div class="t">bash judge/selftest.sh</div>
  </div>
  <div id="log"></div>
</div>

<script type="module">
import { makeRig, loadFaces, placeCamera } from '../lib/part.js';
import { RUNLOG } from '../lib/run.js';

const DUR = 5;
const LINE_H = 42;
const VISIBLE = 17; // 750 px of pane / 42 px row

const rig = makeRig(document.getElementById('stage'), { fov: 30, exposure: 1.4, background: 0x0a0e14 });
rig.renderer.domElement.style.cssText = 'position:absolute;left:1150px;top:150px;width:690px;height:790px;';
const model = loadFaces(rig, '../assets/part.glb');

const RATE = RUNLOG.total_s / DUR;

const logEl = document.getElementById('log');
const nodes = RUNLOG.lines.map((l) => {
  const d = document.createElement('div');
  d.className = 'ln'
    + (/kill rate/.test(l.text) ? ' ok' : /killed/.test(l.text) ? ' kill' : /^SELFTEST_EXIT|^OK$/.test(l.text) ? ' ok' : '');
  d.textContent = l.text;
  d.style.height = `${LINE_H}px`;
  logEl.appendChild(d);
  return d;
});

window.__timelines = {
  'f6-run': {
    seek: (t) => {
      const real = Math.min(RUNLOG.total_s, t * RATE);
      let shown = 0;
      nodes.forEach((d, i) => {
        const on = RUNLOG.lines[i].t <= real;
        d.style.visibility = on ? 'visible' : 'hidden';
        if (on) shown++;
      });
      // Scroll so the newest line sits at the bottom of the pane. `#log` is
      // positioned `inset: 56px 0 0 0` (below the title bar) and the lines are
      // its first children, so translating by the row count is exact — the
      // "+ 20" that would have double-counted the padding is not applied,
      // which is what kept the first lines from sliding under the bar.
      const maxOff = (nodes.length - VISIBLE) * LINE_H;
      logEl.style.transform = `translateY(${-Math.min(maxOff, Math.max(0, (shown - VISIBLE) * LINE_H))}px)`;

      if (model.ready) {
        rig.holder.rotation.y = -0.62 + t * 1.25;
        rig.holder.rotation.x = 0.40 + Math.sin(t * 0.8) * 0.08;
        placeCamera(rig.camera, { dist: 5.4, azim: 8 * Math.sin(t * 0.7), elev: 7, fov: 30 });
        rig.lights.key.position.set(4 * Math.cos(t * 0.5) + 2, 6, 5 * Math.sin(t * 0.5) + 3);
      }
      rig.renderer.render(rig.scene, rig.camera);
    },
  },
};
window.__timelines['f6-run'].seek(0);
</script>
</body>
</html>
