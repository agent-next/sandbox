<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>probe: video mounted from ../clips</title>
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  video { position: absolute; inset: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #tag { position: absolute; left: 40px; top: 40px; color: #fff; font-size: 60px;
         font-family: monospace; }
</style>
</head>
<body>
<div id="root" data-composition-id="probe" data-start="0" data-duration="2" data-width="1920" data-height="1080">
  <video id="v" class="clip" src="../clips/f3_plate.mp4" muted playsinline
         data-start="0" data-duration="2"></video>
  <div id="tag" class="clip" data-start="0" data-duration="2">0</div>
</div>
<script type="module">
window.__timelines = {
  probe: {
    seek: (t) => {
      document.getElementById('tag').textContent = t.toFixed(2);
    },
  },
};
window.__timelines.probe.seek(0);
</script>
</body>
</html>
