<!doctype html><title>ctl-neg</title><body style="margin:0;background:#000">
<canvas id="c" width="800" height="600"></canvas>
<script>
// Known-negative control: a WebGL canvas cleared to one colour and nothing drawn.
const gl = document.getElementById("c").getContext("webgl");
gl.clearColor(0.05, 0.05, 0.08, 1); gl.clear(gl.COLOR_BUFFER_BIT);
</script>
