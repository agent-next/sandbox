name: ci

on:
  push:
  pull_request:

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install "./cli[test]"
      - name: Test
        run: pytest -q
        working-directory: cli

  video-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Install pytest
        run: pip install pytest
      - name: Test
        run: pytest -q -s cookbook/tools

  slop-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Slop gate on changed demos
        run: python3 cookbook/tools/slop_gate.py --base "origin/${{ github.base_ref }}"

  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check version strings agree
        run: python3 scripts/bump_version.py --check

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate JSON manifests
        run: |
          ok=1
          for f in $(git ls-files '*.json'); do
            python -m json.tool "$f" > /dev/null && echo "OK $f" || { echo "INVALID $f"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: Marketplace plugin path exists
        run: |
          set -e
          src=$(python -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['source'])")
          test -d "$src/.claude-plugin" && echo "plugin dir present: $src"
      - name: Plugin manifests have required fields
        run: |
          python - <<'EOF'
          import json, sys
          def require(path, keys):
              d = json.load(open(path))
              missing = [k for k in keys if not d.get(k)]
              if missing:
                  sys.exit(f"{path}: missing {missing}")
              print(f"OK {path}")
          require(".claude-plugin/marketplace.json", ["name"])
          for p in json.load(open(".claude-plugin/marketplace.json"))["plugins"]:
              missing = [k for k in ("name", "source", "description") if not p.get(k)]
              if missing:
                  sys.exit(f"marketplace plugin entry: missing {missing}")
          print("OK marketplace plugin entries")
          require("plugins/sandbox/.claude-plugin/plugin.json", ["name", "description", "version"])
          require("plugins/sandbox/.codex-plugin/plugin.json", ["name", "version"])
          require(".agents/plugins/marketplace.json", ["name"])
          EOF
