name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check versions match the tag
        run: python3 scripts/bump_version.py --check --tag "$GITHUB_REF_NAME"
      - name: Install the tag in a fresh venv
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "git+https://github.com/${{ github.repository }}@$GITHUB_SHA#subdirectory=cli"
      - name: Verify sbx --version matches the tag
        run: |
          got=$("$RUNNER_TEMP/venv/bin/sbx" --version)
          want="${GITHUB_REF_NAME#v}"
          echo "sbx --version: $got (want $want)"
          [ "$got" = "$want" ]
      - name: Run the CLI test suite
        working-directory: cli
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install "pytest>=8.0"
          "$RUNNER_TEMP/venv/bin/pytest" -q
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          test -f "$notes" || { echo "missing release notes: $notes"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --notes-file "$notes"
